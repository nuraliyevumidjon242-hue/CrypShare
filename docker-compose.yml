version: '3.8'

services:
  crypshare:
    build: .
    container_name: crypshare_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=production
    volumes:
      - crypshare_vault:/app/storage
    networks:
      - crypshare_net

volumes:
  crypshare_vault:
    driver: local

networks:
  crypshare_net:
    driver: bridge
